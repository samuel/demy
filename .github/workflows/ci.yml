name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pkg: .
            target: FuzzParseBDF
          - pkg: ./scene/jsonscene
            target: FuzzUnmarshalRender
          - pkg: ./scene/xmlscene
            target: FuzzUnmarshalRender
          - pkg: ./scene/jsonscene
            target: FuzzRoundTrip
          - pkg: ./scene/xmlscene
            target: FuzzRoundTrip
          - pkg: ./scene/xmlscene
            target: FuzzRoundTripJSON
          - pkg: ./internal/codec
            target: FuzzColor
          - pkg: ./internal/codec
            target: FuzzWeight
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 30s ${{ matrix.pkg }}
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-${{ matrix.target }}-${{ strategy.job-index }}
          path: '**/testdata/fuzz/'
