# Quoin display server configuration
# Copy this file to quoin.yaml and adjust for your environment.
# Any value can be overridden by a QUOIN_* environment variable (see below).

# Base URL the server is reachable at from the outside world.
# Used to build image URLs returned to devices and to derive the WebAuthn RP origin.
# Must include scheme and host; no trailing slash.
# For local development: http://localhost:8080
base_url: "https://quoin.example.com"

# Address and port to listen on (ignored when tls.mode is "auto").
listen: ":8080"

# Path prefix for TRMNL device API routes (/api/display, /api/log, /api/setup).
# Leave empty (default) to serve at the root. Must start with / when set.
# Example: "/trmnl" mounts routes at /trmnl/api/display, /trmnl/api/log, /trmnl/api/setup/
device_api_prefix: ""

# Log level: debug, info, warn, error
log_level: "info"

database:
  # Path to the SQLite database file. Created automatically on first run.
  path: "/var/lib/quoin/quoin.db"

tls:
  # TLS mode:
  #   off    — plain HTTP. Use when TLS is terminated upstream (nginx, Caddy, Tailscale).
  #            Set base_url to https:// even in this case so WebAuthn origins are correct.
  #   manual — load cert and key from files; server handles TLS directly.
  #   auto   — obtain and renew certificates via Let's Encrypt (ACME).
  #            Binds :443 for HTTPS and :80 for the HTTP-01 challenge redirect.
  #            The listen value is ignored in this mode.
  mode: "off"

  # For mode: manual
  cert_file: ""
  key_file: ""

  # For mode: auto (Let's Encrypt)
  acme:
    domains:
      - "quoin.example.com"
    email: "admin@example.com"
    cache_dir: "/var/lib/quoin/acme"

    # Challenge type: "http" (default) or "dns".
    #
    # http — Let's Encrypt sends an HTTP request to port 80 to verify domain ownership.
    #         Requires port 80 to be reachable from the internet. Binds :80 automatically.
    #
    # dns  — Let's Encrypt looks for a TXT record on _acme-challenge.<domain>.
    #         Works behind NAT/firewalls. Requires hook scripts (see below).
    challenge: "http"

    # Route53 DNS-01 provider.
    # All fields are optional — credentials fall back to the standard AWS credential
    # chain (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY env vars, ~/.aws/credentials,
    # EC2 instance role, etc.).
    route53:
      region: ""              # AWS region (optional; uses AWS_DEFAULT_REGION or credential chain)
      access_key_id: ""       # explicit AWS credentials (optional)
      secret_access_key: ""   # explicit AWS credentials (optional)
      profile: ""             # AWS named profile from ~/.aws/credentials (optional)
      hosted_zone_id: ""      # pin to a specific Route53 zone ID (optional)
      propagation_wait: "2m"  # wait after setting TXT record; lego default is 2m (optional)

    # Use the Let's Encrypt staging CA instead of production.
    # Staging certificates are not browser-trusted but don't count against rate limits.
    # Useful for testing hook scripts before going to production.
    staging: false

webauthn:
  # The Relying Party ID shown in authenticator UIs.
  # Derived automatically from base_url if omitted (recommended).
  rp_id: ""

  # Human-readable name shown in passkey prompts (e.g. "Touch ID for Quoin").
  rp_display_name: "Quoin"

# Home Assistant MQTT integration (optional)
# When broker_url is set, Quoin publishes device state and HASS discovery payloads
# to the MQTT broker so devices appear automatically in Home Assistant.
# Each device exposes battery, WiFi signal, firmware, wake reason, temperature profile,
# and an Active Plugin select entity that lets automations change what's displayed.
mqtt:
  # MQTT broker URL. Leave empty to disable the bridge entirely.
  # Examples: "tcp://localhost:1883", "ssl://broker.example.com:8883"
  broker_url: ""

  # Broker credentials (optional).
  username: ""
  password: ""

  # Root topic prefix for all published topics (default "quoin").
  # Device state is published under {base_topic}/devices/{mac}/...
  base_topic: "quoin"

  # Home Assistant MQTT discovery prefix (default "homeassistant").
  # Must match the discovery_prefix in your HA MQTT integration settings.
  ha_prefix: "homeassistant"

# Environment variable overrides
# --------------------------------
# Any config value can be set via an environment variable instead of this file:
#
#   QUOIN_BASE_URL                   ← base_url
#   QUOIN_LISTEN                     ← listen
#   QUOIN_TRMNL_DEVICE_API_PREFIX    ← trmnl_device_api_prefix
#   QUOIN_LOG_LEVEL                  ← log_level
#   QUOIN_DATABASE_PATH              ← database.path
#   QUOIN_TLS_MODE                   ← tls.mode
#   QUOIN_TLS_CERT_FILE              ← tls.cert_file
#   QUOIN_TLS_KEY_FILE               ← tls.key_file
#   QUOIN_ACME_EMAIL                 ← tls.acme.email
#   QUOIN_ACME_CACHE_DIR             ← tls.acme.cache_dir
#   QUOIN_ACME_CHALLENGE             ← tls.acme.challenge
#   QUOIN_ACME_DNS_HOOK_ADD          ← tls.acme.dns_hook_add
#   QUOIN_ACME_DNS_HOOK_REMOVE       ← tls.acme.dns_hook_remove
#   QUOIN_WEBAUTHN_RP_ID             ← webauthn.rp_id
#   QUOIN_WEBAUTHN_RP_DISPLAY_NAME   ← webauthn.rp_display_name
#   QUOIN_MQTT_BROKER_URL            ← mqtt.broker_url
#   QUOIN_MQTT_USERNAME              ← mqtt.username
#   QUOIN_MQTT_PASSWORD              ← mqtt.password
#   QUOIN_MQTT_BASE_TOPIC            ← mqtt.base_topic
#   QUOIN_MQTT_HA_PREFIX             ← mqtt.ha_prefix
