{{template "base" .}}
{{define "content"}}
<div class="page-header">
  <h1>Admin: Users</h1>
</div>

<table>
  <thead>
    <tr>
      <th>Display Name</th>
      <th>Email</th>
      <th>Admin</th>
      <th>Created</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    {{range .Data}}
    <tr>
      <td>{{.DisplayName}}</td>
      <td class="text-muted">{{.Email}}</td>
      <td>{{if .IsAdmin}}Yes{{else}}No{{end}}</td>
      <td class="text-muted">{{.CreatedAt.Format "2006-01-02"}}</td>
      <td>
        <form method="POST" action="/admin/users/{{.ID}}/toggle-admin">
          <button type="submit" class="btn btn-secondary btn-sm">
            {{if .IsAdmin}}Remove Admin{{else}}Make Admin{{end}}
          </button>
        </form>
      </td>
    </tr>
    {{else}}
    <tr><td colspan="5" class="text-muted">No users.</td></tr>
    {{end}}
  </tbody>
</table>
{{end}}
