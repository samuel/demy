{{template "base" .}}
{{define "content"}}
<div class="page-header">
  <h1>Add Device</h1>
</div>

<div class="card" style="max-width:480px;">
  <form method="POST" action="/devices">
    <div class="form-group">
      <label for="name">Device Name</label>
      <input type="text" id="name" name="name" required placeholder="Living Room Display">
    </div>
    <div class="form-group">
      <label for="mac">MAC Address</label>
      <input type="text" id="mac" name="mac" required placeholder="AA:BB:CC:DD:EE:FF">
      <div class="form-hint">Found on the device label or in its network settings.</div>
    </div>
    <div class="form-group">
      <label for="refresh_rate">Refresh Rate (seconds)</label>
      <input type="number" id="refresh_rate" name="refresh_rate" value="300" min="60" max="86400">
    </div>
    <div class="form-group">
      <label for="canvas_preset">Device Type</label>
      <select id="canvas_preset" name="canvas_preset">
        <option value="TRMNLOriginal" selected>TRMNL Original (800×480, 2-bit)</option>
        <option value="TRMNLX">TRMNL X (1872×1407, 4-bit)</option>
        <option value="custom">Custom</option>
      </select>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">Create Device</button>
      <a href="/devices" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{{end}}
