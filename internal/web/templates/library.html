{{template "base" .}}
{{define "content"}}
<div class="page-header">
  <h1>Plugin Library</h1>
</div>

{{if .Data}}
<div class="card-grid">
  {{range .Data}}
  <div class="card">
    {{if .Thumbnail}}<img src="{{.Thumbnail}}" alt="" style="width:100%;height:120px;object-fit:cover;border-radius:4px;margin-bottom:0.75rem;">{{end}}
    <h2>{{.Name}}</h2>
    <p>{{.Description}}</p>
    <a href="/library/{{.Slug}}" class="btn btn-secondary btn-sm">View</a>
  </div>
  {{end}}
</div>
{{else}}
<div class="card" style="text-align:center;padding:2rem;">
  <p class="text-muted">No library plugins available yet.</p>
</div>
{{end}}
{{end}}
