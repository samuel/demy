<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Quoin</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="auth-container">
  <div class="auth-box">
    <h1>Sign In</h1>
    <div id="error-msg" class="alert alert-error" style="display:none;"></div>
    <div class="form-group">
      <label for="email">Email (optional for passkey)</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="form-actions" style="flex-direction:column;">
      <button class="btn btn-primary w-full" id="btn-passkey" type="button">Sign in with Passkey</button>
    </div>
    <p class="text-muted mt-2" style="text-align:center;">
      No account? <a href="/register">Register</a>
    </p>
  </div>
</div>
<script>
(async function() {
  const btnPasskey = document.getElementById('btn-passkey');
  const emailInput = document.getElementById('email');
  const errMsg     = document.getElementById('error-msg');

  function showError(msg) {
    errMsg.textContent = msg;
    errMsg.style.display = '';
  }

  if (!window.isSecureContext || !navigator.credentials) {
    showError('Passkeys require a secure connection (HTTPS or localhost). Please access this page over HTTPS.');
    document.getElementById('btn-passkey').disabled = true;
    return;
  }

  function b64url(buf) {
    const bytes = new Uint8Array(buf);
    let str = '';
    for (let i = 0; i < bytes.length; i++) str += String.fromCharCode(bytes[i]);
    return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
  }

  function fromB64url(s) {
    const b = s.replace(/-/g, '+').replace(/_/g, '/');
    const raw = atob(b);
    return Uint8Array.from(raw, c => c.charCodeAt(0));
  }

  btnPasskey.addEventListener('click', async () => {
    errMsg.style.display = 'none';
    const email = emailInput.value.trim();
    try {
      const beginURL = '/auth/login/begin' + (email ? '?email=' + encodeURIComponent(email) : '');
      const beginResp = await fetch(beginURL);
      if (!beginResp.ok) {
        const j = await beginResp.json();
        showError(j.error || 'Failed to begin login');
        return;
      }
      const opts = await beginResp.json();

      // Decode base64url fields.
      opts.publicKey.challenge = fromB64url(opts.publicKey.challenge);
      if (opts.publicKey.allowCredentials) {
        opts.publicKey.allowCredentials = opts.publicKey.allowCredentials.map(c => ({
          ...c, id: fromB64url(c.id)
        }));
      }

      const assertion = await navigator.credentials.get({ publicKey: opts.publicKey });

      const body = JSON.stringify({
        id:       assertion.id,
        rawId:    b64url(assertion.rawId),
        type:     assertion.type,
        response: {
          authenticatorData: b64url(assertion.response.authenticatorData),
          clientDataJSON:    b64url(assertion.response.clientDataJSON),
          signature:         b64url(assertion.response.signature),
          userHandle:        assertion.response.userHandle ? b64url(assertion.response.userHandle) : null,
        },
      });

      const finishResp = await fetch('/auth/login/finish', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body,
      });
      const result = await finishResp.json();
      if (!finishResp.ok) {
        showError(result.error || 'Login failed');
        return;
      }
      window.location.href = result.redirect || '/';
    } catch (e) {
      showError(e.message || 'Login failed');
    }
  });
})();
</script>
</body>
</html>
