{{template "base" .}}
{{define "content"}}
<div class="page-header">
  <h1>Add Plugin</h1>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;">
  <div class="card">
    <h2 class="mb-2">Browse Library</h2>
    <p class="text-muted mb-2">Install a plugin from the Quoin library.</p>
    <a href="/library" class="btn btn-primary">Open Library</a>
  </div>
  <div class="card">
    <h2 class="mb-2">Import from URL</h2>
    <p class="text-muted mb-2">Import an externally hosted plugin by URL.</p>
    <form method="POST" action="/plugins/import">
      <div class="form-group">
        <label for="url">Plugin URL</label>
        <input type="url" id="url" name="url" required placeholder="https://example.com/plugin.json">
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Import</button>
        <a href="/plugins" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{{end}}
