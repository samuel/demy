<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Quoin</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="auth-container">
  <div class="auth-box">
    <h1>Create Account</h1>
    <div id="error-msg" class="alert alert-error" style="display:none;"></div>
    <div class="form-group">
      <label for="display_name">Display Name</label>
      <input type="text" id="display_name" name="display_name" required autocomplete="name">
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="email">
    </div>
    <div class="form-actions" style="flex-direction:column;">
      <button class="btn btn-primary w-full" id="btn-register" type="button">Register with Passkey</button>
    </div>
    <p class="text-muted mt-2" style="text-align:center;">
      Already have an account? <a href="/login">Sign in</a>
    </p>
  </div>
</div>
<script>
(async function() {
  const btnRegister   = document.getElementById('btn-register');
  const displayInput  = document.getElementById('display_name');
  const emailInput    = document.getElementById('email');
  const errMsg        = document.getElementById('error-msg');

  function showError(msg) {
    errMsg.textContent = msg;
    errMsg.style.display = '';
  }

  if (!window.isSecureContext || !navigator.credentials) {
    showError('Passkeys require a secure connection (HTTPS or localhost). Please access this page over HTTPS.');
    document.getElementById('btn-register').disabled = true;
    return;
  }

  function b64url(buf) {
    const bytes = new Uint8Array(buf);
    let str = '';
    for (let i = 0; i < bytes.length; i++) str += String.fromCharCode(bytes[i]);
    return btoa(str).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
  }

  function fromB64url(s) {
    const b = s.replace(/-/g, '+').replace(/_/g, '/');
    const raw = atob(b);
    return Uint8Array.from(raw, c => c.charCodeAt(0));
  }

  btnRegister.addEventListener('click', async () => {
    errMsg.style.display = 'none';
    const displayName = displayInput.value.trim();
    const email       = emailInput.value.trim();
    if (!displayName || !email) {
      showError('Display name and email are required.');
      return;
    }
    try {
      const params = new URLSearchParams({ display_name: displayName, email });
      const beginResp = await fetch('/auth/register/begin?' + params.toString());
      if (!beginResp.ok) {
        const j = await beginResp.json();
        showError(j.error || 'Failed to begin registration');
        return;
      }
      const opts = await beginResp.json();

      opts.publicKey.challenge = fromB64url(opts.publicKey.challenge);
      opts.publicKey.user.id  = fromB64url(opts.publicKey.user.id);
      if (opts.publicKey.excludeCredentials) {
        opts.publicKey.excludeCredentials = opts.publicKey.excludeCredentials.map(c => ({
          ...c, id: fromB64url(c.id)
        }));
      }

      const credential = await navigator.credentials.create({ publicKey: opts.publicKey });

      const body = JSON.stringify({
        id:       credential.id,
        rawId:    b64url(credential.rawId),
        type:     credential.type,
        response: {
          attestationObject: b64url(credential.response.attestationObject),
          clientDataJSON:    b64url(credential.response.clientDataJSON),
        },
      });

      const finishResp = await fetch('/auth/register/finish?' + params.toString(), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body,
      });
      const result = await finishResp.json();
      if (!finishResp.ok) {
        showError(result.error || 'Registration failed');
        return;
      }
      window.location.href = result.redirect || '/';
    } catch (e) {
      showError(e.message || 'Registration failed');
    }
  });
})();
</script>
</body>
</html>
