{{template "base" .}}
{{define "content"}}
<div class="page-header">
  <h1>Account Settings</h1>
</div>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;">
  <div class="card">
    <h2 class="mb-2">Profile</h2>
    <form method="POST" action="/settings">
      <div class="form-group">
        <label for="display_name">Display Name</label>
        <input type="text" id="display_name" name="display_name" value="{{.Data.DisplayName}}" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{.Data.Email}}" required>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </div>
  <div class="card">
    <h2 class="mb-2">Passkeys</h2>
    <p class="text-muted mb-2">Manage your registered passkeys.</p>
    <a href="/settings/passkeys" class="btn btn-secondary btn-sm">Manage Passkeys</a>
  </div>
</div>
{{end}}
